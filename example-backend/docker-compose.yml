
services:
  example-front-end:
    build:
      context: .
      dockerfile: ./example-frontend/Dockerfile
    image: example-frontend:latest
    ports:
      - "3000:5000"

  example-backend:
    build:
      context: .
      dockerfile: ./example-backend/Dockerfile
    image: example-backend:latest
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
    ports:
      - "8080:8080"
    networks:
        - backend

  redis:
    image: redis
    networks:
        - backend

networks:
    backend:
        driver: bridge
