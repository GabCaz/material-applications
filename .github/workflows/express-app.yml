name: Release Node.js app

on:
  push:
    branches:
      - exercises

jobs:
  publish-docker-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # copies your repo files into the Actions workspace.
      - name: Login to Docker Hub
        uses: docker/login-action@v3  # logs you into Docker Hub so you can push images.
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6  # builds the Docker image (using your Dockerfile) and pushes it to Docker Hub.
        with:
          context: ./express-app  # the path to the folder with your Dockerfile.
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/coursepage:latest