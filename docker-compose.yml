services:
  example-front-end:
    build:
      context: ./example-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:5000"  # for direct dev access if needed
    networks:
      - backend

  example-backend:
    build:
      context: ./example-backend
      dockerfile: Dockerfile
    depends_on:
      - redis
      - db
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "8080:8080"
    networks:
      - backend

  redis:
    image: redis
    networks:
      - backend

  db:
    image: postgres:13.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    container_name: postgres
    networks:
      - backend
    volumes:
      - ./database:/var/lib/postgresql/data

  # accessible from http://localhost (and http://localhost:80)
  nginx:
    image: nginx:1.19.10
    ports:
      - "80:80"                # Access NGINX via http://localhost:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - example-front-end
      - example-backend
    networks:
      - backend

networks:
  backend:
    driver: bridge
